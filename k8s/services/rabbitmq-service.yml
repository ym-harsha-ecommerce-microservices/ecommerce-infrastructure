apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service  
  namespace: ecommerce-infrastructure
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - name: rabbitmq
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq