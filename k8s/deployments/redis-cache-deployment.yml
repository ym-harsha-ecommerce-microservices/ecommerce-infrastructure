apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache-deployment
  namespace: ecommerce-infrastructure
  labels:
    app: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 6379